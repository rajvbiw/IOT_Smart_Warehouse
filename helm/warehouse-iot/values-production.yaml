db:
  host: RDS_ENDPOINT_PLACEHOLDER
  name: warehouse_iot
  port: 3306
  user: root

replicaCount: 1

ingress:
  host: warehouse.example.com

autoscaling:
  enabled: false

resources:
  backend:
    requests:
      cpu: 10m
      memory: 10Mi
    limits:
      cpu: 500m
      memory: 256Mi
  frontend:
    requests:
      cpu: 10m
      memory: 5Mi
    limits:
      cpu: 200m
      memory: 128Mi

redis:
  host: ELASTICACHE_ENDPOINT_PLACEHOLDER
  port: 6379

influx:
  url: http://warehouse-iot-production-influxdb:8086
  org: warehouse-org
  bucket: warehouse_sensors
  token: warehouse-iot-influx-token-prod
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 500m
      memory: 512Mi

jwt:
  secret: warehouse-iot-jwt-secret-prod-32chars
  refreshSecret: warehouse-iot-refresh-secret-prod-32c

aws:
  region: ap-south-1
  iotEndpoint: IOT_ENDPOINT_PLACEHOLDER
  sqsQueueUrl: SQS_URL_PLACEHOLDER
  s3Bucket: warehouse-iot-prod-reports
  snsTopicArn: SNS_TOPIC_ARN_PLACEHOLDER
