replicaCount: 3

ingress:
  host: warehouse.example.com

autoscaling:
  minReplicas: 3
  maxReplicas: 20
  targetCPU: 65

resources:
  backend:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 1024Mi
  frontend:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
