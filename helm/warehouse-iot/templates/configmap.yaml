apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "warehouse-iot.fullname" . }}-config
  labels:
    {{- include "warehouse-iot.labels" . | nindent 4 }}
data:
  NODE_ENV: "production"
  DB_HOST: {{ .Values.db.host | quote }}
  DB_PORT: {{ .Values.db.port | quote }}
  DB_NAME: {{ .Values.db.name | quote }}
  REDIS_HOST: {{ .Values.redis.host | quote }}
  REDIS_PORT: "6379"
  INFLUX_URL: {{ .Values.influx.url | quote }}
  INFLUX_ORG: {{ .Values.influx.org | quote }}
  INFLUX_BUCKET: {{ .Values.influx.bucket | quote }}
  MQTT_BROKER_URL: "mqtt://{{ include "warehouse-iot.fullname" . }}-mosquitto:1883"
  AWS_REGION: {{ .Values.aws.region | quote }}
  AWS_IOT_ENDPOINT: {{ .Values.aws.iotEndpoint | quote }}
  SQS_QUEUE_URL: {{ .Values.aws.sqsQueueUrl | quote }}
  S3_BUCKET: {{ .Values.aws.s3Bucket | quote }}
  FRONTEND_URL: "https://{{ .Values.ingress.host }}"
  SOCKET_CORS_ORIGIN: "https://{{ .Values.ingress.host }}"
  SIMULATE_DEVICES: "false"
