apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "warehouse-iot.fullname" . }}-backend
  labels:
    {{- include "warehouse-iot.labels" . | nindent 4 }}
    app: backend
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "warehouse-iot.selectorLabels" . | nindent 6 }}
      app: backend
  template:
    metadata:
      labels:
        {{- include "warehouse-iot.selectorLabels" . | nindent 8 }}
        app: backend
    spec:
      serviceAccountName: {{ include "warehouse-iot.fullname" . }}-sa
      containers:
        - name: backend
          image: "{{ .Values.image.backend.repository }}:{{ .Values.image.backend.tag }}"
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          ports:
            - containerPort: 5000
          resources:
            {{- toYaml .Values.resources.backend | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
          envFrom:
            - configMapRef:
                name: {{ include "warehouse-iot.fullname" . }}-config
            - secretRef:
                name: {{ include "warehouse-iot.fullname" . }}-secret
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
