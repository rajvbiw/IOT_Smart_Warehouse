apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "warehouse-iot.fullname" . }}-grafana-pvc
  labels:
    {{- include "warehouse-iot.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp3
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "warehouse-iot.fullname" . }}-grafana-datasources
  labels:
    {{- include "warehouse-iot.labels" . | nindent 4 }}
data:
  influxdb.yaml: |
    apiVersion: 1
    datasources:
      - name: InfluxDB
        type: influxdb
        access: proxy
        url: http://{{ include "warehouse-iot.fullname" . }}-influxdb:8086
        jsonData:
          version: Flux
          organization: {{ .Values.influx.org | quote }}
          defaultBucket: {{ .Values.influx.bucket | quote }}
        secureJsonData:
          token: ${INFLUXDB_TOKEN}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "warehouse-iot.fullname" . }}-grafana-dashboards-prov
  labels:
    {{- include "warehouse-iot.labels" . | nindent 4 }}
data:
  dashboard.yaml: |
    apiVersion: 1
    providers:
      - name: warehouse-dashboards
        folder: Warehouse IoT
        type: file
        options:
          path: /etc/grafana/provisioning/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "warehouse-iot.fullname" . }}-grafana-dashboards-json
  labels:
    {{- include "warehouse-iot.labels" . | nindent 4 }}
data:
  warehouse-overview.json: |
    {
      "title": "Warehouse IoT Overview",
      "style": "dark",
      "panels": []
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "warehouse-iot.fullname" . }}-grafana
  labels:
    {{- include "warehouse-iot.labels" . | nindent 4 }}
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "warehouse-iot.selectorLabels" . | nindent 6 }}
      app: grafana
  template:
    metadata:
      labels:
        {{- include "warehouse-iot.selectorLabels" . | nindent 8 }}
        app: grafana
    spec:
      securityContext:
        fsGroup: 472
        runAsUser: 472
      containers:
        - name: grafana
          image: grafana/grafana:10.0.0
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "warehouse-iot.fullname" . }}-secret
                  key: DB_PASSWORD
            - name: INFLUXDB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "warehouse-iot.fullname" . }}-secret
                  key: INFLUX_TOKEN
          volumeMounts:
            - name: storage
              mountPath: /var/lib/grafana
            - name: provisioning-datasource
              mountPath: /etc/grafana/provisioning/datasources/influxdb.yaml
              subPath: influxdb.yaml
            - name: provisioning-dashboard-conf
              mountPath: /etc/grafana/provisioning/dashboards/dashboard.yaml
              subPath: dashboard.yaml
            - name: provisioning-dashboard-json
              mountPath: /etc/grafana/provisioning/dashboards/warehouse-overview.json
              subPath: warehouse-overview.json
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: {{ include "warehouse-iot.fullname" . }}-grafana-pvc
        - name: provisioning-datasource
          configMap:
            name: {{ include "warehouse-iot.fullname" . }}-grafana-datasources
        - name: provisioning-dashboard-conf
          configMap:
            name: {{ include "warehouse-iot.fullname" . }}-grafana-dashboards-prov
        - name: provisioning-dashboard-json
          configMap:
            name: {{ include "warehouse-iot.fullname" . }}-grafana-dashboards-json
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "warehouse-iot.fullname" . }}-grafana
  labels:
    {{- include "warehouse-iot.labels" . | nindent 4 }}
  {{- if and .Values.service (and .Values.service.grafana (eq .Values.service.grafana.type "LoadBalancer")) }}
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
  {{- end }}
spec:
  type: {{ if and .Values.service .Values.service.grafana }}{{ .Values.service.grafana.type }}{{ else }}ClusterIP{{ end }}
  ports:
    - name: http
      port: 80
      targetPort: 3000
  selector:
    {{- include "warehouse-iot.selectorLabels" . | nindent 4 }}
    app: grafana
