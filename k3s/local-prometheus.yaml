apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-prometheus
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: local-prometheus
  template:
    metadata:
      labels:
        app: local-prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: storage
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: local-prometheus-config
        - name: storage
          persistentVolumeClaim:
            claimName: local-prometheus-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: local-prometheus-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: local-prometheus-config
  namespace: default
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'edge-processor'
        static_configs:
          - targets: ['localhost:5000']
---
apiVersion: v1
kind: Service
metadata:
  name: local-prometheus
  namespace: default
spec:
  ports:
    - port: 9090
  selector:
    app: local-prometheus
