apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: warehouse-iot-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/YOUR_ORG/warehouse-iot"
    targetRevision: main
    path: argocd/
  destination:
    server: "https://kubernetes.default.svc"
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
