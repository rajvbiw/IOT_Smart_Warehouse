name: IoT Warehouse CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  lint-and-test:
    name: Lint & Test Core Codebase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # Backend Lint and Test
      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Lint Backend Code
        run: |
          cd backend
          npm run lint || echo "No lint rules configured or lint failed"

      - name: Run Backend Unit Tests
        run: |
          cd backend
          npm run test || echo "No tests configured or tests failed"

      # Frontend Lint and Build Check
      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint Frontend Code
        run: |
          cd frontend
          npm run lint || echo "No lint rules configured or lint failed"

      - name: Build Frontend (Production Compilation Check)
        run: |
          cd frontend
          npm run build

  build-and-push:
    name: Build & Push Docker Images
    needs: lint-and-test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    env:
      HAS_AWS_KEYS: ${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set Environment Variables
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "PROJECT_NAME=warehouse-iot-prod" >> $GITHUB_ENV
            echo "ROLE_NAME=warehouse-iot-prod-github-actions-role" >> $GITHUB_ENV
            echo "AWS_REGION=ap-south-1" >> $GITHUB_ENV
          else
            echo "PROJECT_NAME=warehouse-iot-dev" >> $GITHUB_ENV
            echo "ROLE_NAME=warehouse-iot-dev-github-actions-role" >> $GITHUB_ENV
            echo "AWS_REGION=ap-south-1" >> $GITHUB_ENV
          fi

      - name: Configure AWS Credentials via OIDC
        if: env.HAS_AWS_KEYS == 'false'
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ env.ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Configure AWS Credentials via Access Keys
        if: env.HAS_AWS_KEYS == 'true'
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      # Backend Build and Scan
      - name: Build Backend Docker Image
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/${{ env.PROJECT_NAME }}-backend:${{ github.sha }} -f backend/Dockerfile backend/

      - name: Scan Backend Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.PROJECT_NAME }}-backend:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Backend Image to ECR
        run: |
          docker tag ${{ steps.login-ecr.outputs.registry }}/${{ env.PROJECT_NAME }}-backend:${{ github.sha }} ${{ steps.login-ecr.outputs.registry }}/${{ env.PROJECT_NAME }}-backend:latest
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.PROJECT_NAME }}-backend:${{ github.sha }}
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.PROJECT_NAME }}-backend:latest

      # Frontend Build and Scan
      - name: Build Frontend Docker Image
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/${{ env.PROJECT_NAME }}-frontend:${{ github.sha }} -f frontend/Dockerfile frontend/

      - name: Scan Frontend Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.PROJECT_NAME }}-frontend:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Frontend Image to ECR
        run: |
          docker tag ${{ steps.login-ecr.outputs.registry }}/${{ env.PROJECT_NAME }}-frontend:${{ github.sha }} ${{ steps.login-ecr.outputs.registry }}/${{ env.PROJECT_NAME }}-frontend:latest
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.PROJECT_NAME }}-frontend:${{ github.sha }}
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.PROJECT_NAME }}-frontend:latest

  deploy:
    name: Continuous Deployment to EKS
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      HAS_AWS_KEYS: ${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' }}
      HAS_SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set Cluster Target Environment Variables
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "CLUSTER_NAME=warehouse-iot-prod-cluster" >> $GITHUB_ENV
            echo "K8S_NAMESPACE=warehouse-prod" >> $GITHUB_ENV
            echo "ENVIRONMENT=production" >> $GITHUB_ENV
            echo "AWS_REGION=ap-south-1" >> $GITHUB_ENV
            echo "PROJECT_NAME=warehouse-iot-prod" >> $GITHUB_ENV
            echo "ROLE_NAME=warehouse-iot-prod-github-actions-role" >> $GITHUB_ENV
          else
            echo "CLUSTER_NAME=warehouse-iot-dev-cluster" >> $GITHUB_ENV
            echo "K8S_NAMESPACE=warehouse-dev" >> $GITHUB_ENV
            echo "ENVIRONMENT=development" >> $GITHUB_ENV
            echo "AWS_REGION=ap-south-1" >> $GITHUB_ENV
            echo "PROJECT_NAME=warehouse-iot-dev" >> $GITHUB_ENV
            echo "ROLE_NAME=warehouse-iot-dev-github-actions-role" >> $GITHUB_ENV
          fi

      - name: Configure AWS Credentials via OIDC
        if: env.HAS_AWS_KEYS == 'false'
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ env.ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Configure AWS Credentials via Access Keys
        if: env.HAS_AWS_KEYS == 'true'
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.2'

      - name: Update Kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ env.CLUSTER_NAME }} --region ${{ env.AWS_REGION }}



      - name: Deploy Manifests / Trigger Helm Rollout
        run: |
          echo "Deploying update to namespace: ${{ env.K8S_NAMESPACE }}"

          # Clean up old in-cluster MySQL resources to reclaim storage/memory
          kubectl delete statefulset warehouse-iot-${{ env.ENVIRONMENT }}-mysql -n ${{ env.K8S_NAMESPACE }} --ignore-not-found || true
          kubectl delete pvc mysql-storage-warehouse-iot-${{ env.ENVIRONMENT }}-mysql-0 -n ${{ env.K8S_NAMESPACE }} --ignore-not-found || true

          # Force delete old InfluxDB resources to trigger clean initialization with new token
          kubectl delete statefulset warehouse-iot-${{ env.ENVIRONMENT }}-influxdb -n ${{ env.K8S_NAMESPACE }} --ignore-not-found || true
          kubectl delete pvc influxdb-storage-warehouse-iot-${{ env.ENVIRONMENT }}-influxdb-0 -n ${{ env.K8S_NAMESPACE }} --ignore-not-found || true

          # Fetch RDS Endpoint
          RDS_ENDPOINT=$(aws rds describe-db-instances \
            --db-instance-identifier ${{ env.PROJECT_NAME }}-mysql \
            --query 'DBInstances[0].Endpoint.Address' \
            --output text \
            --region ${{ env.AWS_REGION }} 2>/dev/null || echo "")
          if [ -z "$RDS_ENDPOINT" ] || [ "$RDS_ENDPOINT" = "None" ]; then
            echo "WARNING: Could not fetch RDS endpoint. Will use placeholder."
            RDS_ENDPOINT="RDS_ENDPOINT_PLACEHOLDER"
          else
            echo "RDS Endpoint fetched: $RDS_ENDPOINT"
          fi

          # Fetch ElastiCache Endpoint
          REDIS_ENDPOINT=$(aws elasticache describe-cache-clusters \
            --cache-cluster-id ${{ env.PROJECT_NAME }}-redis \
            --show-cache-node-info \
            --query 'CacheClusters[0].CacheNodes[0].Endpoint.Address' \
            --output text \
            --region ${{ env.AWS_REGION }} 2>/dev/null || echo "")
          if [ -z "$REDIS_ENDPOINT" ] || [ "$REDIS_ENDPOINT" = "None" ]; then
            echo "WARNING: Could not fetch ElastiCache endpoint. Will use placeholder."
            REDIS_ENDPOINT="ELASTICACHE_ENDPOINT_PLACEHOLDER"
          else
            echo "ElastiCache Endpoint fetched: $REDIS_ENDPOINT"
          fi

          # Fetch DB password from Secrets Manager
          DB_PASSWORD=$(aws secretsmanager get-secret-value \
            --secret-id warehouse-iot/db-password \
            --query 'SecretString' \
            --output text \
            --region ${{ env.AWS_REGION }} 2>/dev/null || echo "password")

          # Deploy via Helm
          cd helm/warehouse-iot
          helm upgrade --install warehouse-iot-${{ env.ENVIRONMENT }} . \
            --namespace ${{ env.K8S_NAMESPACE }} \
            --create-namespace \
            --set image.backend.repository=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.PROJECT_NAME }}-backend \
            --set image.backend.tag=${{ github.sha }} \
            --set image.frontend.repository=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.PROJECT_NAME }}-frontend \
            --set image.frontend.tag=${{ github.sha }} \
            --set db.host="$RDS_ENDPOINT" \
            --set db.password="$DB_PASSWORD" \
            --set redis.host="$REDIS_ENDPOINT" \
            --values values-production.yaml

      - name: Verify Deployment Rollout
        run: |
          kubectl rollout status deployment/warehouse-iot-${{ env.ENVIRONMENT }}-backend -n ${{ env.K8S_NAMESPACE }} --timeout=300s
          kubectl rollout status deployment/warehouse-iot-${{ env.ENVIRONMENT }}-frontend -n ${{ env.K8S_NAMESPACE }} --timeout=120s

      - name: Debug Deployment on Failure
        if: failure()
        run: |
          echo "==== Pods ===="
          kubectl get pods -n ${{ env.K8S_NAMESPACE }} -o wide
          echo "==== Backend Deployment Describe ===="
          kubectl describe deployment warehouse-iot-${{ env.ENVIRONMENT }}-backend -n ${{ env.K8S_NAMESPACE }} || true
          echo "==== Pod Describes ===="
          kubectl describe pods -n ${{ env.K8S_NAMESPACE }} || true
          echo "==== Events ===="
          kubectl get events -n ${{ env.K8S_NAMESPACE }} --sort-by='.metadata.creationTimestamp' || true
          echo "==== Pod Logs (current + previous) ===="
          for pod in $(kubectl get pods -n ${{ env.K8S_NAMESPACE }} -o jsonpath='{.items[*].metadata.name}'); do
            echo "--- Current logs: $pod ---"
            kubectl logs $pod -n ${{ env.K8S_NAMESPACE }} --all-containers --tail=50 2>/dev/null || true
            echo "--- Previous logs: $pod ---"
            kubectl logs $pod -n ${{ env.K8S_NAMESPACE }} --all-containers --previous --tail=50 2>/dev/null || true
          done
          echo "==== ConfigMap values ===="
          kubectl get configmap warehouse-iot-production-config -n ${{ env.K8S_NAMESPACE }} -o yaml 2>/dev/null || true


      - name: Notify Slack Webhook on Deployment Status
        if: always() && env.HAS_SLACK_WEBHOOK == 'true'
        uses: ravsamhq/notify-slack-action@v2
        with:
          status: ${{ job.status }}
          notification_title: '*{repo}* deployment to *${{ env.ENVIRONMENT }}* finished with *{status_message}*'
          message_format: '{emoji} *{workflow}* {status_message} in <{run_url}|{run_id}>'
          footer: 'Linked to Commit <{commit_url}|{commit_sha}>'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
