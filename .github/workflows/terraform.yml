name: Terraform CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to run"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
          - destroy
          - force-unlock
      lock_id:
        description: "Lock ID to release (required for force-unlock)"
        required: false
        type: string

permissions:
  id-token: write
  contents: read

env:
  HAS_AWS_KEYS: ${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' }}

jobs:
  # ==========================================
  # JOB 1: Terraform Plan
  # ==========================================
  terraform-plan:
    name: 📋 Terraform Plan
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' || 
      github.event_name == 'pull_request' || 
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.action == 'plan' || github.event.inputs.action == 'apply'))
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set Environment Variables
        run: |
          if [ "${{ github.base_ref || github.ref_name }}" = "main" ]; then
            echo "TF_DIR=terraform/environments/prod" >> $GITHUB_ENV
            echo "AWS_REGION=ap-south-1" >> $GITHUB_ENV
            echo "ROLE_NAME=warehouse-iot-prod-github-actions-role" >> $GITHUB_ENV
          else
            echo "TF_DIR=terraform/environments/dev" >> $GITHUB_ENV
            echo "AWS_REGION=ap-south-1" >> $GITHUB_ENV
            echo "ROLE_NAME=warehouse-iot-dev-github-actions-role" >> $GITHUB_ENV
          fi

      - name: Configure AWS Credentials via OIDC
        if: env.HAS_AWS_KEYS == 'false'
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ env.ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Configure AWS Credentials via Access Keys
        if: env.HAS_AWS_KEYS == 'true'
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Bootstrap S3 Backend & DynamoDB Table
        run: |
          if [ "${{ env.TF_DIR }}" = "terraform/environments/prod" ]; then
            BUCKET_NAME="warehouse-iot-tf-state-prod"
            DYNAMODB_TABLE="warehouse-iot-tf-locks-prod"
          else
            BUCKET_NAME="warehouse-iot-tf-state-dev"
            DYNAMODB_TABLE="warehouse-iot-tf-locks-dev"
          fi

          echo "Bootstrapping backend for bucket: $BUCKET_NAME and table: $DYNAMODB_TABLE in region ${{ env.AWS_REGION }}"

          # Create S3 bucket if it doesn't exist
          if ! aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
            if [ "${{ env.AWS_REGION }}" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$BUCKET_NAME" --region ${{ env.AWS_REGION }}
            else
              aws s3api create-bucket --bucket "$BUCKET_NAME" --region ${{ env.AWS_REGION }} --create-bucket-configuration LocationConstraint=${{ env.AWS_REGION }}
            fi
            aws s3api put-bucket-versioning --bucket "$BUCKET_NAME" --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "$BUCKET_NAME" --server-side-encryption-configuration '{"Rules": [{"ApplyServerSideEncryptionByDefault": {"SSEAlgorithm": "AES256"}}]}'
            echo "Created S3 state bucket: $BUCKET_NAME"
          else
            echo "S3 state bucket: $BUCKET_NAME already exists."
          fi

          # Create DynamoDB table if it doesn't exist
          if ! aws dynamodb describe-table --table-name "$DYNAMODB_TABLE" --region ${{ env.AWS_REGION }} 2>/dev/null; then
            aws dynamodb create-table \
              --table-name "$DYNAMODB_TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region ${{ env.AWS_REGION }}
            echo "Created DynamoDB lock table: $DYNAMODB_TABLE"
          else
            echo "DynamoDB lock table: $DYNAMODB_TABLE already exists."
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7

      - name: Terraform Format Check
        run: |
          cd ${{ env.TF_DIR }}
          terraform fmt -check -recursive

      - name: Terraform Init
        run: |
          cd ${{ env.TF_DIR }}
          terraform init

      - name: Terraform Validate
        run: |
          cd ${{ env.TF_DIR }}
          terraform validate

      - name: Terraform Plan
        run: |
          cd ${{ env.TF_DIR }}
          terraform plan -no-color -input=false -out=tfplan

      - name: Save plan output
        run: |
          cd ${{ env.TF_DIR }}
          terraform show -no-color tfplan > plan_output.txt

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: |
            ${{ env.TF_DIR }}/tfplan
            ${{ env.TF_DIR }}/plan_output.txt

  # ==========================================
  # JOB 2: Terraform Apply
  # ==========================================
  terraform-apply:
    name: 🚀 Terraform Apply
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set Environment Variables
        run: |
          if [ "${{ github.base_ref || github.ref_name }}" = "main" ]; then
            echo "TF_DIR=terraform/environments/prod" >> $GITHUB_ENV
            echo "AWS_REGION=ap-south-1" >> $GITHUB_ENV
            echo "ROLE_NAME=warehouse-iot-prod-github-actions-role" >> $GITHUB_ENV
          else
            echo "TF_DIR=terraform/environments/dev" >> $GITHUB_ENV
            echo "AWS_REGION=ap-south-1" >> $GITHUB_ENV
            echo "ROLE_NAME=warehouse-iot-dev-github-actions-role" >> $GITHUB_ENV
          fi

      - name: Configure AWS Credentials via OIDC
        if: env.HAS_AWS_KEYS == 'false'
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ env.ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Configure AWS Credentials via Access Keys
        if: env.HAS_AWS_KEYS == 'true'
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7

      - name: Terraform Init
        run: |
          cd ${{ env.TF_DIR }}
          terraform init

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_DIR }}

      - name: Terraform Apply
        run: |
          cd ${{ env.TF_DIR }}
          terraform apply -auto-approve tfplan

  # ==========================================
  # JOB 3: Terraform Destroy (Manual Only)
  # ==========================================
  terraform-destroy:
    name: 💥 Terraform Destroy
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set Environment Variables
        run: |
          if [ "${{ github.base_ref || github.ref_name }}" = "main" ]; then
            echo "TF_DIR=terraform/environments/prod" >> $GITHUB_ENV
            echo "AWS_REGION=ap-south-1" >> $GITHUB_ENV
            echo "ROLE_NAME=warehouse-iot-prod-github-actions-role" >> $GITHUB_ENV
          else
            echo "TF_DIR=terraform/environments/dev" >> $GITHUB_ENV
            echo "AWS_REGION=ap-south-1" >> $GITHUB_ENV
            echo "ROLE_NAME=warehouse-iot-dev-github-actions-role" >> $GITHUB_ENV
          fi

      - name: Configure AWS Credentials via OIDC
        if: env.HAS_AWS_KEYS == 'false'
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ env.ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Configure AWS Credentials via Access Keys
        if: env.HAS_AWS_KEYS == 'true'
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7

      - name: Terraform Init
        run: |
          cd ${{ env.TF_DIR }}
          terraform init

      - name: Terraform Destroy
        run: |
          cd ${{ env.TF_DIR }}
          terraform destroy -auto-approve -input=false

  # ==========================================
  # JOB 4: Terraform Force Unlock (Manual Only)
  # ==========================================
  terraform-force-unlock:
    name: 🔓 Terraform Force Unlock
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'force-unlock'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set Environment Variables
        run: |
          if [ "${{ github.base_ref || github.ref_name }}" = "main" ]; then
            echo "TF_DIR=terraform/environments/prod" >> $GITHUB_ENV
            echo "AWS_REGION=ap-south-1" >> $GITHUB_ENV
            echo "ROLE_NAME=warehouse-iot-prod-github-actions-role" >> $GITHUB_ENV
          else
            echo "TF_DIR=terraform/environments/dev" >> $GITHUB_ENV
            echo "AWS_REGION=ap-south-1" >> $GITHUB_ENV
            echo "ROLE_NAME=warehouse-iot-dev-github-actions-role" >> $GITHUB_ENV
          fi

      - name: Configure AWS Credentials via OIDC
        if: env.HAS_AWS_KEYS == 'false'
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ env.ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Configure AWS Credentials via Access Keys
        if: env.HAS_AWS_KEYS == 'true'
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7

      - name: Terraform Init
        run: |
          cd ${{ env.TF_DIR }}
          terraform init

      - name: Release State Lock
        run: |
          cd ${{ env.TF_DIR }}
          if [ -n "${{ github.event.inputs.lock_id }}" ]; then
            terraform force-unlock -force ${{ github.event.inputs.lock_id }}
          else
            echo "Error: lock_id input is required for force-unlock!"
            exit 1
          fi
